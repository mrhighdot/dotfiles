[env]
TERM = "xterm-256color"

[font]
normal.family = "Cascadia Code NF"
normal.style="Bold"
size=16

[window]
decorations="Buttonless"
startup_mode="Maximized"
dynamic_padding=true
option_as_alt="Both"
opacity=0.95
padding = {x = 12, y= 12}

[cursor]
style = {shape='Block',blinking='Always'}
thickness = 0.3
